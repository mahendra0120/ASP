[project]
name = "a-s-p"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "datasets>=4.0,<4.8.6",
    # Pinned (not just floored) on purpose: the client in
    # A2A_image_delegation_client.py is hand-written against this
    # exact wire format (fasta2a.schema.Part/Message — verified
    # directly against 2.0.1's source). This library's A2A message
    # schema has changed more than once across recent major versions
    # without warning; an unbounded ">=" constraint here previously
    # let a newer, incompatible version silently break image/file
    # delivery to both agents (parts were built in a shape the
    # installed server no longer recognized). If you deliberately
    # upgrade this, re-check fasta2a/schema.py's Part/Message
    # TypedDicts and re-verify A2A_image_delegation_client.py against
    # them before trusting image delegation again.
    "fasta2a[pydantic-ai]==2.0.1",
    "fastmcp>=4.0.3",
    "gradio>=6.19.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jinja2>=3.1.6",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-huggingface>=0.3.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.0.0",
    "numpy>=2.4.3",
    "packaging>=26.2",
    "pandas>=3.0.1",
    "protobuf>=7.34.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-ai-slim>=2.42.0",
    "scikit-learn>=1.9.0",
    "sse-starlette>=3.4.2",
    "starlette>=1.0.0",
    "torch>=2.12.1",
    "transformers>=5.1.0,<=5.5.0",
    "unsloth>=2026.9.1",
    "uvicorn>=0.46.0",
]
